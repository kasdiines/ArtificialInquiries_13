<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artificial Inquiries – Exercices</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f4f6fa; color: #1c2a3a; }
    header { background: #243b63; color: #fff; padding: 28px 8%; }
    header h1 { margin: 0 0 8px; font-size: 2.2rem; }
    header p { margin: 0; font-size: 1.1rem; }
    main { max-width: 1000px; margin: 28px auto; padding: 0 16px; }
    section { background: #fff; border-radius: 16px; padding: 28px 32px; margin-bottom: 28px;
              box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    h2 { margin-top: 0; color: #243b63; }
    button { background: #243b63; color: #fff; border: 0; border-radius: 8px; padding: 14px 24px;
             font-size: 1rem; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { margin-top: 18px; }
    .error { color: #a61b1b; }
    .ok { color: #1b7a3a; }
    .exercise { border: 1px solid #dde3ee; border-radius: 12px; padding: 16px 20px; margin-bottom: 16px; }
    .exercise h3 { margin: 0 0 6px; color: #243b63; }
    .exercise p.desc { margin: 0 0 10px; }
    dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; }
    dt { font-weight: bold; color: #4a5a73; }
    dd { margin: 0; overflow-wrap: anywhere; }
    a { color: #243b63; }
  </style>
</head>
<body>
  <header>
    <h1>Artificial Inquiries</h1>
    <p>Gestion des exercices et des connaissances professionnelles</p>
  </header>

  <main>
    <section>
      <h2>Connexion à Omeka S</h2>
      <p>Cette application récupère les exercices enregistrés dans l'instance Omeka S commune.</p>
      <button id="refresh" type="button">Actualiser les exercices</button>
      <div id="status" role="status"></div>
    </section>

    <section>
      <h2>Exercices enregistrés</h2>
      <div id="list"><p>Indisponible</p></div>
    </section>
  </main>

  <script>
    // ====== CONFIGURATION ======
    // Si l'API directe est bloquée par CORS, remplace API_BASE par l'URL de ton proxy,
    // par exemple "https://TON-WORKER.workers.dev" (sans slash final).
    const CONFIG = {
      API_BASE: "https://humanum-p8.fr/omk_artificialinquiries/api",
      RESOURCE_CLASS_ID: 134,   // classe des exercices (cf. admin/item?resource_class_id=134)
      PER_PAGE: 100,
      TIMEOUT_MS: 15000
    };

    const statusEl = document.getElementById("status");
    const listEl = document.getElementById("list");
    const btn = document.getElementById("refresh");

    function setStatus(msg, cls) {
      statusEl.textContent = msg;
      statusEl.className = cls || "";
    }

    // Convertit une valeur JSON-LD d'Omeka en texte lisible
    function valueToNode(v) {
      if (v["@value"] !== undefined) return document.createTextNode(String(v["@value"]));
      const label = v["display_title"] || v["o:label"];
      const id = v["@id"];
      if (id) {
        const a = document.createElement("a");
        a.href = id; a.target = "_blank"; a.rel = "noopener";
        a.textContent = label || id;
        return a;
      }
      return document.createTextNode(label || JSON.stringify(v));
    }

    function firstText(item, keys) {
      for (const k of keys) {
        const arr = item[k];
        if (Array.isArray(arr) && arr.length && arr[0]["@value"]) return arr[0]["@value"];
      }
      return null;
    }

    function renderExercise(item) {
      const box = document.createElement("article");
      box.className = "exercise";

      const h = document.createElement("h3");
      h.textContent = item["o:title"] || firstText(item, ["dcterms:title", "artinq:titre"]) || "(sans titre)";
      box.appendChild(h);

      const desc = firstText(item, ["dcterms:description", "artinq:description"]);
      if (desc) {
        const p = document.createElement("p");
        p.className = "desc";
        p.textContent = desc;
        box.appendChild(p);
      }

      // Autres propriétés (dcterms:*, artinq:*, etc.), affichées avec leur libellé
      const shown = new Set(["dcterms:title", "dcterms:description", "artinq:titre", "artinq:description"]);
      const dl = document.createElement("dl");
      for (const [key, vals] of Object.entries(item)) {
        if (key.startsWith("@") || key.startsWith("o:") || shown.has(key)) continue;
        if (!Array.isArray(vals) || !vals.length || typeof vals[0] !== "object") continue;
        const dt = document.createElement("dt");
        dt.textContent = vals[0]["property_label"] || key;
        const dd = document.createElement("dd");
        vals.forEach((v, i) => {
          if (i) dd.appendChild(document.createTextNode(" ; "));
          dd.appendChild(valueToNode(v));
        });
        dl.append(dt, dd);
      }
      if (dl.children.length) box.appendChild(dl);
      return box;
    }

    async function loadExercises() {
      btn.disabled = true;
      setStatus("Chargement…");
      const url = CONFIG.API_BASE + "/items?resource_class_id=" + CONFIG.RESOURCE_CLASS_ID +
                  "&per_page=" + CONFIG.PER_PAGE;
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), CONFIG.TIMEOUT_MS);
      try {
        const res = await fetch(url, { headers: { "Accept": "application/json" }, signal: ctrl.signal });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const items = await res.json();

        listEl.replaceChildren();
        if (!items.length) {
          listEl.innerHTML = "<p>Aucun exercice trouvé.</p>";
        } else {
          items.forEach(it => listEl.appendChild(renderExercise(it)));
        }
        setStatus(items.length + " exercice(s) chargé(s).", "ok");
      } catch (err) {
        listEl.innerHTML = "<p>Indisponible</p>";
        let hint = "";
        if (location.protocol === "file:") {
          hint = " Ouvre la page depuis un serveur (GitHub Pages ou « python -m http.server »), pas en double-cliquant sur le fichier.";
        } else if (err.name === "AbortError") {
          hint = " Délai dépassé.";
        } else if (err instanceof TypeError) {
          hint = " Probablement CORS : le serveur Omeka n'autorise pas ce site. Demande l'en-tête Access-Control-Allow-Origin ou utilise un proxy (voir CONFIG.API_BASE).";
        }
        setStatus("Impossible de charger les exercices. Détail : " + err.message + "." + hint, "error");
        console.error(err);
      } finally {
        clearTimeout(timer);
        btn.disabled = false;
      }
    }

    btn.addEventListener("click", loadExercises);
    loadExercises();
  </script>
</body>
</html>
