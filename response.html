<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artificial Inquiries</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fa;
            color: #263238;
        }

        header {
            background: #253b63;
            color: white;
            padding: 25px 8%;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
            color: #e0e7ff;
        }

        main {
            max-width: 1000px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #0000000d;
        }

        h2 {
            color: #253b63;
            margin-top: 0;
        }

        button {
            padding: 10px 16px;
            margin-top: 15px;
            margin-right: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .primary {
            background: #253b63;
            color: white;
        }

        .item {
            border: 1px solid #e0e5ed;
            border-radius: 8px;
            padding: 18px;
            margin-top: 15px;
        }

        .item h3 {
            margin-top: 0;
        }

        .item a {
            color: #2459a9;
            overflow-wrap: anywhere;
        }

        .message {
            margin-top: 15px;
        }

        .error {
            color: #a32222;
        }

        .success {
            color: #176b3a;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
        }
    </style>
</head>

<body>

<header>
    <h1>Artificial Inquiries</h1>
    <p>Gestion des travaux exemplaires et des connaissances professionnelles</p>
</header>

<main>
    <section class="card">
        <h2>Connexion à Omeka S</h2>

        <p>
            Cette application récupère les travaux exemplaires
            enregistrés dans Omeka S.
        </p>

        <button class="primary" id="reload-button" type="button">
            Actualiser les travaux
        </button>

        <p id="message" class="message" role="status">
            Chargement des travaux...
        </p>
    </section>

    <section class="card">
        <h2>Travaux exemplaires</h2>

        <p id="counter">Chargement...</p>

        <div id="work-list"></div>
    </section>
</main>

<footer>
    Artificial Inquiries — Projet WebCognictive
</footer>

<script>
    const API_URL = "api.php";

    const list = document.getElementById("work-list");
    const message = document.getElementById("message");
    const counter = document.getElementById("counter");
    const reloadButton = document.getElementById("reload-button");

    function getValue(item, property) {
        const values = item[property];

        if (!Array.isArray(values) || values.length === 0) {
            return "";
        }

        return values
            .map(value => value["@value"] || "")
            .filter(Boolean)
            .join(", ");
    }

    function createParagraph(label, value) {
        const paragraph = document.createElement("p");
        paragraph.textContent = label + (value || "Non renseigné");
        return paragraph;
    }

    function renderWorks(items) {
        list.replaceChildren();

        counter.textContent =
            items.length + (items.length > 1
                ? " travaux"
                : " travail");

        if (items.length === 0) {
            const empty = document.createElement("p");
            empty.textContent =
                "Aucun travail exemplaire trouvé dans Omeka S.";
            list.appendChild(empty);
            return;
        }

        items.forEach(function(item) {
            const article = document.createElement("article");
            article.className = "item";

            const title = document.createElement("h3");
            title.textContent =
                item["o:title"] || "Sans titre";
            article.appendChild(title);

            const description = getValue(
                item,
                "dcterms:description"
            );

            article.appendChild(
                createParagraph("Description : ", description)
            );

            const domain = getValue(
                item,
                "artinq:professionalDomain"
            );

            article.appendChild(
                createParagraph("Domaine professionnel : ", domain)
            );

            const url = getValue(
                item,
                "artinq:referenceUrl"
            );

            if (url) {
                try {
                    const parsedUrl = new URL(url);

                    if (["http:", "https:"].includes(parsedUrl.protocol)) {
                        const link = document.createElement("a");
                        link.href = parsedUrl.href;
                        link.target = "_blank";
                        link.rel = "noopener noreferrer";
                        link.textContent = "Consulter la référence";
                        article.appendChild(link);
                    }
                } catch (error) {
                    article.appendChild(
                        createParagraph("URL de référence : ", url)
                    );
                }
            }

            const details = document.createElement("p");
            details.textContent = "Identifiant Omeka S : " + item["o:id"];
            article.appendChild(details);

            list.appendChild(article);
        });
    }

    async function loadWorks() {
        reloadButton.disabled = true;
        message.className = "message";
        message.textContent = "Chargement des travaux depuis Omeka S...";
        counter.textContent = "Chargement...";
        list.replaceChildren();

        try {
            const response = await fetch(API_URL, {
                cache: "no-store"
            });

            if (!response.ok) {
                throw new Error("Erreur HTTP " + response.status);
            }

            const data = await response.json();

            if (!data.success || !Array.isArray(data.items)) {
                throw new Error(
                    data.message || "La réponse de l'API est incorrecte."
                );
            }

            const works = data.items.filter(function(item) {
                return Array.isArray(item["@type"])
                    && item["@type"].includes("artinq:ExemplaryWork");
            });

            renderWorks(works);

            message.className = "message success";
            message.textContent =
                "Connexion à Omeka S réussie. Travaux chargés : "
                + works.length + ".";
        } catch (error) {
            counter.textContent = "Indisponible";

            message.className = "message error";
            message.textContent =
                "Impossible de charger les travaux : "
                + error.message
                + ". Vérifie que XAMPP et Omeka S fonctionnent.";
        } finally {
            reloadButton.disabled = false;
        }
    }

    reloadButton.addEventListener("click", loadWorks);

    loadWorks();
</script>

</body>
</html>
